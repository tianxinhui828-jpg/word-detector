<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word 批量检测</title>
    <meta name="description" content="在浏览器本地处理文档，快速校验关键词、边距、字体与段落格式" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('word-detect-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'light' ? '#f5f5f7' : '#000000');
          }
        } catch (e) {}
      })();
    </script>

</html>
